<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7rs Dark System</title>

<style>
body {#bgVideo {
  position: fixed;
  right: 0;
  bottom: 0;
  min-width: 100%;
  min-height: 100%;
  z-index: -2;
}
    margin: 0;
    font-family: monospace;
    background: black;
    color: #00ff99;
    text-align: center;
    overflow: hidden;
}

/* canvas للخلفية */
canvas {
    position: fixed;
    top: 0;
    left: 0;
    z-index: -1;
}

/* العنوان */
h1 {
    margin-top: 80px;
    font-size: 32px;
    text-shadow: 0 0 15px #00ff99;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from { text-shadow: 0 0 5px #00ff99; }
    to { text-shadow: 0 0 20px #00ff99; }
}

/* الصناديق */
input {
    width: 80%;
    max-width: 400px;
    padding: 12px;
    margin: 10px;
    border: 2px solid #00ff99;
    background: transparent;
    color: #00ff99;
    outline: none;
    font-size: 16px;
    box-shadow: 0 0 10px #00ff99;
}

/* الأزرار */
button {
    padding: 12px 20px;
    margin: 10px;
    border: none;
    background: #00ff99;
    color: black;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 0 10px #00ff99;
}

button:hover {
    background: black;
    color: #00ff99;
    border: 1px solid #00ff99;
    box-shadow: 0 0 20px #00ff99;
}

/* النتيجة */
#result {
    margin-top: 20px;
    font-size: 18px;
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<h1>💀 7rs DARK SYSTEM</h1>

<input type="text" id="text" placeholder="النص">
<br>
<input type="password" id="key" placeholder="كلمة السر">
<br>

<button onclick="encrypt()">تشفير</button>
<button onclick="decrypt()">فك التشفير</button>

<div id="result"></div>

<script>
// Matrix background
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const letters = "01";
const fontSize = 14;
const columns = canvas.width / fontSize;

const drops = [];
for (let i = 0; i < columns; i++) {
    drops[i] = 1;
}

function draw() {
    ctx.fillStyle = "rgba(0,0,0,0.05)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#00ff99";
    ctx.font = fontSize + "px monospace";

    for (let i = 0; i < drops.length; i++) {
        const text = letters[Math.floor(Math.random() * letters.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
            drops[i] = 0;
        }

        drops[i]++;
    }
}

setInterval(draw, 33);

// تشفير بسيط
function encrypt() {
    let text = document.getElementById("text").value;
    let key = document.getElementById("key").value;

    let result = btoa(text + key);
    document.getElementById("result").innerText = result;
}

function decrypt() {
    let text = document.getElementById("text").value;
    let key = document.getElementById("key").value;

    try {
        let result = atob(text);
        document.getElementById("result").innerText = result.replace(key, "");
    } catch {
        document.getElementById("result").innerText = "خطأ";
    }
}
</script>

</body><video autoplay muted loop id="bgVideo">
  <source src="video.mp4" type="video/mp4">
</video>
</html>
